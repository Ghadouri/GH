<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lycée de Choum · Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#16231c;--mute:#5d6e64;--green:#0f5132;--gold:#c8962e;--line:#d7e0da;--bad:#a23b2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;line-height:1.6}
header{background:var(--green);color:#fff;padding:20px 16px;text-align:center;border-bottom:4px solid var(--gold)}
header h1{margin:0;font-size:1.3rem}
header p{margin:2px 0 0;opacity:.85;font-size:.9rem}
main{max-width:760px;margin:20px auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin:10px 0 4px}
select,input{width:100%;padding:10px;font:inherit;border:1px solid var(--line);border-radius:6px;background:#fff}
button{font:inherit;font-weight:600;background:var(--green);color:#fff;border:0;border-radius:6px;padding:10px 18px;cursor:pointer;margin-top:12px}
button.link{background:none;color:var(--green);text-decoration:underline;padding:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.msg{color:var(--mute);text-align:center;padding:8px}.err{color:var(--bad)}.ok{color:var(--green)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;direction:ltr;text-align:center}
th,td{border:1px solid var(--line);padding:6px 8px;white-space:nowrap}
th{background:#e8efea}
td.nm{direction:rtl;text-align:right}
td input{width:62px;padding:5px;text-align:center}
td input.r{width:130px;text-align:right}
h2{margin:0 0 4px;font-size:1.1rem}h3{margin:16px 0 6px;font-size:1rem;color:var(--green)}
.hide{display:none}
footer{text-align:center;padding:10px 0 30px}
</style>
</head>
<body>
<header>
  <h1>الاطلاع على الدرجات · Consulter les notes</h1>
  <p>Lycée de Choum · ثانوية شوم</p>
</header>
<main>

<!-- ===== الطلاب ===== -->
<section id="stu">
  <div class="card">
    <label for="cls">اختر القسم · Classe</label>
    <select id="cls"><option value="">…</option></select>
    <label for="num">اختر الرقم · Numéro</label>
    <select id="num"><option value="">…</option></select>
  </div>
  <div id="res"></div>
  <div id="stuMsg" class="msg"></div>
  <footer><button class="link" onclick="show('tch')">فضاء الأساتذة · Espace enseignants</button></footer>
</section>

<!-- ===== الأساتذة ===== -->
<section id="tch" class="hide">
  <div class="card" id="login">
    <h2>فضاء الأساتذة · Espace enseignants</h2>
    <label for="code">رمز الدخول · Code d’accès</label>
    <input id="code" type="password" autocomplete="off">
    <button onclick="login()">دخول · Entrer</button>
    <div id="lmsg" class="msg"></div>
  </div>
  <div class="card hide" id="panel">
    <h2 id="who"></h2>
    <label for="tcls">القسم · Classe</label>
    <select id="tcls"><option value="">…</option></select>
    <div id="grid" class="scroll"></div>
    <div id="tmsg" class="msg"></div>
  </div>
  <footer><button class="link" onclick="show('stu')">العودة · Retour</button></footer>
</section>

</main>
<script>
// ضع هنا رابط تطبيق الويب (Apps Script → Deploy → Web app)
const API = "PASTE_WEB_APP_URL_HERE";
const $ = id => document.getElementById(id);
const COLS = ["C1","C2","C3","Dev1","Dev2","Dev3"];
let code = "";

function show(id){ $("stu").classList.toggle("hide", id!=="stu"); $("tch").classList.toggle("hide", id!=="tch"); }
async function api(params){
  const r = await fetch(API + "?" + new URLSearchParams(params));
  return r.json();
}
function fill(sel, list){
  sel.innerHTML = '<option value="">…</option>' + list.map(x => `<option>${x}</option>`).join("");
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* الطلاب */
async function init(){
  try{
    fill($("cls"), await api({a:"classes"}));
  }catch(e){
    $("stuMsg").className = "msg err";
    $("stuMsg").textContent = "البيانات غير متوفرة · Données indisponibles";
  }
}
$("cls").onchange = async () => {
  $("res").innerHTML = ""; fill($("num"), []);
  if ($("cls").value) fill($("num"), await api({a:"nums", c:$("cls").value}));
};
$("num").onchange = async () => {
  $("res").innerHTML = ""; $("stuMsg").textContent = "";
  if (!$("num").value) return;
  const d = await api({a:"student", c:$("cls").value, n:$("num").value});
  if (!d.nom){ $("stuMsg").textContent = "لا توجد بيانات"; return; }
  let h = `<div class="card"><h2>${esc(d.nom)}</h2><div class="msg">${esc($("cls").value)} · ${esc($("num").value)}</div>`;
  if (!d.grades.length) h += `<div class="msg">لم تُنشر الدرجات بعد · Notes pas encore publiées</div>`;
  else {
    h += `<div class="scroll"><table><tr><th>المادة</th>${COLS.map(c=>`<th>${c}</th>`).join("")}<th>M.Dev</th><th>MG</th><th>الملاحظات</th></tr>`;
    d.grades.forEach(g => {
      h += `<tr><td class="nm">${esc(g.matiere)}</td>${COLS.map(c=>`<td>${esc(g[c])}</td>`).join("")}<td>${esc(g.MDev)}</td><td><b>${esc(g.MG)}</b></td><td class="nm">${esc(g.remarques)}</td></tr>`;
    });
    h += `</table></div>`;
  }
  $("res").innerHTML = h + "</div>";
};

/* الأساتذة */
async function login(){
  code = $("code").value.trim();
  $("lmsg").textContent = "…";
  try{
    const d = await api({a:"login", code});
    if (!d.ok){ $("lmsg").className = "msg err"; $("lmsg").textContent = "الرمز غير صحيح · Code incorrect"; return; }
    $("login").classList.add("hide"); $("panel").classList.remove("hide");
    $("who").textContent = `${d.nom} — ${d.matiere}`;
    fill($("tcls"), d.classes);
  }catch(e){ $("lmsg").className = "msg err"; $("lmsg").textContent = "تعذر الاتصال · Connexion impossible"; }
}
$("tcls").onchange = async () => {
  $("grid").innerHTML = ""; $("tmsg").textContent = "";
  if (!$("tcls").value) return;
  const d = await api({a:"grid", c:$("tcls").value, code});
  let h = `<table id="gt"><tr><th>#</th><th>الاسم</th>${COLS.map(c=>`<th>${c}</th>`).join("")}<th>الملاحظات</th></tr>`;
  d.students.forEach(s => {
    h += `<tr data-n="${esc(s.num)}"><td>${esc(s.num)}</td><td class="nm">${esc(s.nom)}</td>` +
      COLS.map(c=>`<td><input inputmode="decimal" data-k="${c}" value="${esc(s.g[c])}"></td>`).join("") +
      `<td><input class="r" data-k="remarques" value="${esc(s.g.remarques)}"></td></tr>`;
  });
  $("grid").innerHTML = h + `</table><button onclick="save()">حفظ الدرجات · Enregistrer</button>`;
};
async function save(){
  const rows = [...document.querySelectorAll("#gt tr[data-n]")].map(tr => {
    const o = {num: tr.dataset.n};
    tr.querySelectorAll("input").forEach(i => o[i.dataset.k] = i.value.replace(",", ".").trim());
    return o;
  });
  $("tmsg").className = "msg"; $("tmsg").textContent = "…";
  try{
    const r = await fetch(API, {method:"POST", body: JSON.stringify({code, c:$("tcls").value, rows})});
    const d = await r.json();
    $("tmsg").className = d.ok ? "msg ok" : "msg err";
    $("tmsg").textContent = d.ok ? "تم الحفظ · Enregistré" : "فشل الحفظ · Échec";
  }catch(e){ $("tmsg").className = "msg err"; $("tmsg").textContent = "فشل الحفظ · Échec"; }
}
init();
</script>
</body>
</html>
